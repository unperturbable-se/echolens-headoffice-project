<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipLens - Portal Authentication</title>

    <!-- Framework & Application CSS -->
    <link rel="stylesheet"
      href="https://unpkg.com/missing.css@1.1.3/dist/missing.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="login-page">
    <main class="login-card">
      <header class="login-header">
        <h2>ShipLens 1.0</h2>
        <p class="subtext">Branch-to-Head-Office Management Platform</p>
      </header>

      <div id="error-message" class="alert-error" role="alert"></div>

      <form id="login-form">
        <p>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"
            placeholder="user@shiplens.org" required dir="ltr">
        </p>

        <p>
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
            placeholder="••••••••••••" required>
        </p>

        <button type="submit" id="submit-btn" class="accent full-width">
                Authenticate Session
            </button>
      </form>

      <footer class="login-footer">
            EchoLens Organizational Platform &copy; 2026
        </footer>
    </main>

    <!-- Dependencies must load in this exact order -->
    <script src="auth/api_client.js"></script>
    <script src="auth/session.js"></script>
    <script src="auth/login.js"></script>
  </body>
</html>
