      - id: SCHEMA-005
        task: "GRANT EXECUTE ON FUNCTION private.purge_expired_sessions() TO app_backend"
        note: "or wrap in new api.purge_expired_sessions()"
        done: false
      - id: SCHEMA-006
        task: "ALTER DEFAULT PRIVILEGES for api and private schemas"
        sql: |
          ALTER DEFAULT PRIVILEGES IN SCHEMA api, private
              REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC, anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA api
              GRANT EXECUTE ON FUNCTIONS TO app_backend;
        done: false

