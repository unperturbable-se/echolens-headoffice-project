name: Backend CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: appdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: appuser
      PGPASSWORD: apppassword
      PGDATABASE: appdb

      db_host: localhost
      db_port: 5432
      db_name: appdb
      db_user: appuser
      db_password: apppassword

    steps:
      - uses: actions/checkout@v4

      - name: Run SQL files (schema → seed → api)
        run: |
          for f in schema seed api; do
            echo "==> Database/$f.sql"
            psql -v ON_ERROR_STOP=1 -f Database/$f.sql
          done

      - name: Build image
        run: docker build -t backend:test -f backend/Dockerfile backend

      - name: Run container
        run: |
          docker run -d --name backend --network host \
            -e db_host \
            -e db_port \
            -e db_name \
            -e db_user \
            -e db_password \
            -e PORT=8000 \
            backend:test

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf http://localhost:8000/health) && break
            sleep 2
          done
          docker logs backend
          test "$body" = '{"status":"healthy","database":"connected"}'
