name: Backend CI

on:
  push:
    paths:
      - 'Backend/**'
      - 'Database/**'
  pull_request:
    paths:
      - 'Backend/**'
      - 'Database/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: appdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: apppassword
      PGDATABASE: appdb
      db_host: localhost
      db_port: 5432
      db_name: appdb
      db_user: postgres
      db_password: apppassword
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          load: true
          tags: backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Supabase roles
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"

      - name: Run SQL files
        run: |
          for f in schema seed api; do
            psql -v ON_ERROR_STOP=1 -f Database/$f.sql
          done

      - name: Run container
        run: |
          docker run -d --name backend --network host \
            -e db_host -e db_port -e db_name -e db_user -e db_password -e DB_SSLMODE \
            -e PORT=8000 backend:test

      - name: Health check
        run: |
          for i in $(seq 30); do
            body=$(curl -sf http://localhost:8000/health) && break
            sleep 2
          done
          docker logs backend
          test "$body" = '{"status":"healthy","database":"connected"}'