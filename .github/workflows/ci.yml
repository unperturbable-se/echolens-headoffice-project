name: Python CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

   
    defaults:
      run:
        working-directory: ./Backend 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Note: Python setup needs to happen globally, so we explicitly clear the working directory for this step
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        defaults:
          run:
            working-directory: . 

      # Back inside your subfolder, install tools and run them
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Tests (Pytest)
        run: pytest .
